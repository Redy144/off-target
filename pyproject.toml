[project]
name = "offtarget"
version = "0.1.0"
description = "Radioterapia guza przy niedopasowanym polu napromieniania: solver PDE, surogaty, SA, DA, NODE/UDE, PINN i SuperNet"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Kacper Bieniasz" },
    { name = "Krzysztof Kapera" },
]
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pykan>=0.2.8",
    "pymc>=6.4.0",
    "reservoirpy>=0.4.3",
    "salib>=1.6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "tabpfn>=9.2.0",
    "torch>=2.15.0",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.70.1",
]

[project.scripts]
reproduce = "offtarget.reproduce:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offtarget"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
